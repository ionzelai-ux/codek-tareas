<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODEK — Control de Tareas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root {
  --granate: #97272E; --granate-dark: #7a1f25;
  --negro: #0A0A0A; --gris-oscuro: #141414; --gris-medio: #1E1E1E;
  --gris-borde: #2A2A2A; --gris-texto: #777;
  --blanco: #F5F5F5; --blanco-dim: #AAAAAA;
  --verde: #4CAF50; --amarillo: #FFC107;

  /* Colores por labor */
  --c-clase:       #1565C0;
  --c-preparar:    #6A1B9A;
  --c-ep:          #00695C;
  --c-prep-ep:     #2E7D32;
  --c-video-g:     #E65100;
  --c-video-e:     #BF360C;
  --c-llamadas:    #F9A825;
  --c-flyers:      #558B2F;
  --c-limpieza:    #4E342E;
  --c-instagram:   #AD1457;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--negro); color: var(--blanco); font-family: "Inter", sans-serif; min-height: 100vh; }

.topbar { background: var(--gris-oscuro); border-bottom: 1px solid var(--gris-borde); padding: 12px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-logo { height: 32px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-title { font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: 0.18em; color: var(--gris-texto); text-transform: uppercase; }
.sync-indicator { font-family: "Space Mono", monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 2px; border: 1px solid var(--gris-borde); color: var(--gris-texto); }
.sync-indicator.ok { border-color: var(--verde); color: var(--verde); }
.sync-indicator.err { border-color: var(--granate); color: var(--granate); }
.sync-indicator.loading { border-color: var(--amarillo); color: var(--amarillo); }

.tabs { display: flex; background: var(--gris-oscuro); border-bottom: 1px solid var(--gris-borde); padding: 0 28px; }
.tab { padding: 13px 22px; font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; color: var(--gris-texto); border-bottom: 2px solid transparent; border-top: none; border-left: none; border-right: none; background: none; transition: all 0.15s; }
.tab:hover { color: var(--blanco); }
.tab.active { color: var(--granate); border-bottom-color: var(--granate); }

.main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
.hidden { display: none !important; }

.loader-overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 999; }
.loader-spinner { width: 36px; height: 36px; border: 3px solid var(--gris-borde); border-top-color: var(--granate); border-radius: 50%; animation: spin 0.8s linear infinite; }
.loader-txt { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 0.12em; color: var(--gris-texto); }
@keyframes spin { to { transform: rotate(360deg); } }

.controls { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.emp-btn { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 9px 24px; border-radius: 3px; border: 1px solid var(--gris-borde); background: var(--gris-medio); color: var(--blanco-dim); cursor: pointer; transition: all 0.15s; }
.emp-btn:hover { border-color: var(--granate); color: var(--blanco); }
.emp-btn.active { background: var(--granate); border-color: var(--granate); color: #fff; }
.date-wrap { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.date-wrap label { font-size: 10px; color: var(--gris-texto); font-family: "Space Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; }
.date-wrap input[type="date"] { background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 3px; color: var(--blanco); font-family: "Space Mono", monospace; font-size: 11px; padding: 7px 12px; }
.date-nav-btn { background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 3px; color: var(--blanco-dim); font-size: 14px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
.date-nav-btn:hover { border-color: var(--granate); color: var(--blanco); background: rgba(151,39,46,0.1); }

.stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
.stat { background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 4px; padding: 16px 20px; }
.stat-label { font-size: 9px; font-family: "Space Mono", monospace; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gris-texto); margin-bottom: 8px; }
.stat-value { font-family: "Space Mono", monospace; font-size: 24px; font-weight: 700; }
.stat-value.ok { color: var(--verde); }
.stat-value.warn { color: var(--amarillo); }
.stat-value.bad { color: var(--granate); }
.stat-sub { font-size: 10px; color: var(--gris-texto); margin-top: 4px; }

.sched-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.section-label { font-family: "Space Mono", monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gris-texto); }

/* ── LEYENDA ── */
.leyenda { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.leyenda-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--blanco-dim); }
.leyenda-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* ── GRID ── */
.grid { background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 4px; overflow: hidden; }

.slot { display: grid; grid-template-columns: 72px 44px 1fr 1fr; border-bottom: 1px solid var(--gris-borde); min-height: 48px; align-items: stretch; transition: background 0.2s; }
.slot:last-child { border-bottom: none; }

.slot-time { padding: 0 12px; display: flex; align-items: center; font-family: "Space Mono", monospace; font-size: 11px; color: var(--gris-texto); border-right: 1px solid var(--gris-borde); background: var(--gris-oscuro); }

/* Botón rápido "Clase" */
.slot-clase-btn { border: none; border-right: 1px solid var(--gris-borde); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; color: var(--gris-borde); font-size: 16px; }
.slot-clase-btn:hover { background: rgba(21,101,192,0.25); color: #90CAF9; }
.slot-clase-btn.activo { background: rgba(21,101,192,0.35); color: #90CAF9; }
.slot-clase-btn title { display: none; }

.slot-select { background: transparent; border: none; border-right: 1px solid var(--gris-borde); color: var(--blanco-dim); font-family: "Inter", sans-serif; font-size: 12px; cursor: pointer; padding: 0 12px; width: 100%; appearance: none; -webkit-appearance: none; }
.slot-select:focus { outline: none; }
.slot-select option { background: #1E1E1E; }
.slot-select.filled { color: var(--blanco); font-weight: 500; }

.slot-comment { background: transparent; border: none; color: var(--gris-texto); font-family: "Inter", sans-serif; font-size: 11px; padding: 12px; resize: none; width: 100%; height: 48px; }
.slot-comment:focus { outline: none; color: var(--blanco); }
.slot-comment::placeholder { color: #333; }

/* Colores de fondo por labor */
.slot[data-labor="Impartir clase"]           { background: rgba(21,101,192,0.18); border-left: 3px solid #1565C0; }
.slot[data-labor="Preparar clase"]           { background: rgba(106,27,154,0.18); border-left: 3px solid #6A1B9A; }
.slot[data-labor="Entrenamiento personal"]   { background: rgba(0,105,92,0.18);   border-left: 3px solid #00695C; }
.slot[data-labor="Preparar EP personalizado"]{ background: rgba(46,125,50,0.18);  border-left: 3px solid #2E7D32; }
.slot[data-labor="Grabar vídeo"]             { background: rgba(230,81,0,0.18);   border-left: 3px solid #E65100; }
.slot[data-labor="Editar vídeo"]             { background: rgba(191,54,12,0.18);  border-left: 3px solid #BF360C; }
.slot[data-labor="Llamadas"]                 { background: rgba(249,168,37,0.15); border-left: 3px solid #F9A825; }
.slot[data-labor="Repartir flyers"]          { background: rgba(85,139,47,0.18);  border-left: 3px solid #558B2F; }
.slot[data-labor="Limpieza"]                 { background: rgba(78,52,46,0.25);   border-left: 3px solid #795548; }
.slot[data-labor="Gestión Instagram"]        { background: rgba(173,20,87,0.18);  border-left: 3px solid #AD1457; }
.slot[data-labor="Otros"]                    { background: rgba(84,110,122,0.18); border-left: 3px solid #546E7A; }

/* Ajustar color de texto en slots con labor */
.slot[data-labor] .slot-time { background: transparent; }
.slot[data-labor] .slot-select { color: var(--blanco); font-weight: 500; }
.slot[data-labor] .slot-comment { color: var(--blanco-dim); }
.slot[data-labor] .slot-comment::placeholder { color: rgba(255,255,255,0.2); }

.save-bar { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 20px; }
.save-msg { font-size: 11px; color: var(--verde); font-family: "Space Mono", monospace; opacity: 0; transition: opacity 0.3s; }
.save-msg.show { opacity: 1; }
.btn-save { background: var(--granate); border: none; color: #fff; font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; padding: 11px 28px; border-radius: 3px; cursor: pointer; transition: background 0.15s; }
.btn-save:hover { background: var(--granate-dark); }
.btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

/* RESUMEN */
.resumen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.r-card { background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 4px; overflow: hidden; }
.r-card-head { background: var(--gris-oscuro); padding: 13px 18px; border-bottom: 1px solid var(--gris-borde); display: flex; align-items: center; gap: 10px; }
.r-card-title { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.inicial-badge { margin-left: auto; background: rgba(151,39,46,0.15); border: 1px solid var(--granate); color: var(--granate); font-family: "Space Mono", monospace; font-size: 9px; padding: 3px 8px; border-radius: 2px; }
table.wtable { width: 100%; border-collapse: collapse; }
table.wtable th { padding: 9px 16px; text-align: left; font-family: "Space Mono", monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gris-texto); border-bottom: 1px solid var(--gris-borde); background: rgba(0,0,0,0.2); }
table.wtable td { padding: 9px 16px; font-size: 12px; border-bottom: 1px solid rgba(42,42,42,0.4); color: var(--blanco-dim); }
table.wtable tr:last-child td { border-bottom: none; }
td.ok { color: var(--verde) !important; font-family: "Space Mono", monospace; }
td.bad { color: var(--granate) !important; font-family: "Space Mono", monospace; }
td.warn { color: var(--amarillo) !important; font-family: "Space Mono", monospace; }
.prog-wrap { padding: 14px 18px; }
.prog-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--gris-texto); font-family: "Space Mono", monospace; margin-bottom: 6px; }
.prog-bg { height: 5px; background: var(--gris-borde); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; background: var(--granate); transition: width 0.5s ease; }
.prog-fill.ok { background: var(--verde); }
.total-row { padding: 13px 18px; border-top: 1px solid var(--gris-borde); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
.total-label { font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gris-texto); }
.total-val { font-family: "Space Mono", monospace; font-size: 18px; font-weight: 700; }
.comp-sec { margin-top: 22px; background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 4px; overflow: hidden; }
.comp-sec-head { padding: 13px 18px; background: var(--gris-oscuro); border-bottom: 1px solid var(--gris-borde); font-family: "Space Mono", monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gris-texto); }
.comp-emp-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid rgba(42,42,42,0.4); }
.comp-emp-row:last-child { border-bottom: none; }
.comp-emp-name { font-size: 14px; font-weight: 500; }
.comp-emp-detail { text-align: right; }
.comp-inicial { font-family: "Space Mono", monospace; font-size: 10px; color: var(--gris-texto); margin-bottom: 3px; }
.comp-valor { font-family: "Space Mono", monospace; font-size: 18px; font-weight: 700; color: var(--granate); }
.comp-valor.ok { color: var(--verde); }

/* INFORME */
.informe-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.period-btn { font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 18px; border-radius: 3px; border: 1px solid var(--gris-borde); background: var(--gris-medio); color: var(--blanco-dim); cursor: pointer; transition: all 0.15s; }
.period-btn:hover { border-color: var(--granate); color: var(--blanco); }
.period-btn.active { background: var(--granate); border-color: var(--granate); color: #fff; }
.range-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.range-wrap label { font-size: 10px; color: var(--gris-texto); font-family: "Space Mono", monospace; text-transform: uppercase; }
.range-wrap input[type="date"] { background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 3px; color: var(--blanco); font-family: "Space Mono", monospace; font-size: 11px; padding: 6px 10px; }
.range-sep { color: var(--gris-texto); }
.inf-emp-filter { display: flex; gap: 8px; }
.inf-emp-btn { font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 16px; border-radius: 3px; border: 1px solid var(--gris-borde); background: transparent; color: var(--blanco-dim); cursor: pointer; transition: all 0.15s; }
.inf-emp-btn:hover { border-color: var(--granate); color: var(--blanco); }
.inf-emp-btn.active { border-color: var(--granate); color: var(--granate); background: rgba(151,39,46,0.1); }
.informe-body { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.inf-card { background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 4px; overflow: hidden; }
.inf-card-head { background: var(--gris-oscuro); padding: 13px 18px; border-bottom: 1px solid var(--gris-borde); display: flex; align-items: center; justify-content: space-between; }
.inf-card-title { font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.inf-card-total { font-family: "Space Mono", monospace; font-size: 13px; color: var(--granate); }
.inf-labor-row { display: flex; align-items: center; gap: 12px; padding: 9px 18px; border-bottom: 1px solid rgba(42,42,42,0.4); }
.inf-labor-row:last-child { border-bottom: none; }
.inf-labor-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.inf-labor-name { font-size: 12px; color: var(--blanco-dim); flex: 1; }
.inf-labor-bar-wrap { width: 100px; height: 4px; background: var(--gris-borde); border-radius: 2px; overflow: hidden; }
.inf-labor-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.inf-labor-hrs { font-family: "Space Mono", monospace; font-size: 12px; color: var(--blanco); min-width: 36px; text-align: right; }
.inf-empty { padding: 20px 18px; font-size: 12px; color: var(--gris-texto); }
.inf-combined { margin-top: 22px; background: var(--gris-medio); border: 1px solid var(--gris-borde); border-radius: 4px; overflow: hidden; }
.inf-combined-head { background: var(--gris-oscuro); padding: 13px 18px; border-bottom: 1px solid var(--gris-borde); font-family: "Space Mono", monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gris-texto); }

::-webkit-scrollbar { width: 5px; height: 5px; }
.admin-edit-input { background: rgba(151,39,46,0.15); border: 1px solid var(--granate); border-radius: 3px; color: var(--blanco); font-family: "Space Mono", monospace; font-size: 11px; padding: 2px 6px; width: 50px; text-align: center; }
.admin-semana-wrap { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.admin-save-btn { font-family: "Space Mono", monospace; font-size: 9px; padding: 2px 8px; border-radius: 2px; border: none; background: var(--granate); color: #fff; cursor: pointer; }
.admin-badge { display: inline-block; background: var(--granate); color: #fff; font-family: "Space Mono", monospace; font-size: 9px; padding: 2px 7px; border-radius: 2px; letter-spacing: 0.08em; }
::-webkit-scrollbar-track { background: var(--gris-oscuro); }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<div class="loader-overlay" id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-txt">Cargando datos...</div>
</div>

<div class="topbar">
  <img class="topbar-logo" src="logo.png" alt="CODEK Training">
  <div class="topbar-right">
    <span class="topbar-title">Control de Tareas</span>
    <button id="btn-admin" onclick="toggleAdmin()" style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 12px;border-radius:3px;border:1px solid var(--gris-borde);background:transparent;color:var(--gris-texto);cursor:pointer">⚙ Admin</button>
    <span class="sync-indicator" id="sync-indicator">Sincronizando...</span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('registro')">Registro diario</button>
  <button class="tab" onclick="showTab('resumen')">Resumen</button>
  <button class="tab" onclick="showTab('informe')">Informe de tareas</button>
  <button class="tab" onclick="showTab('calendario')">Calendario</button>
</div>

<div class="main">

  <!-- TAB REGISTRO -->
  <div id="tab-registro">
    <div class="controls">
      <button class="emp-btn active" onclick="setEmpleado('Diego')" id="btn-Diego">Diego</button>
      <button class="emp-btn" onclick="setEmpleado('Jesus')" id="btn-Jesus">Jesús</button>
      <button class="emp-btn" onclick="setEmpleado('Alvarez')" id="btn-Alvarez">Álvarez</button>
      <div class="date-wrap">
        <label>Fecha</label>
        <button class="date-nav-btn" onclick="cambiarDia(-1)" title="Día anterior">‹</button>
        <input type="date" id="fecha-picker" onchange="onFechaChange()">
        <button class="date-nav-btn" onclick="cambiarDia(1)" title="Día siguiente">›</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-label">Horas hoy</div>
        <div class="stat-value" id="stat-hoy">0h</div>
        <div class="stat-sub">de 6h objetivo</div>
      </div>
      <div class="stat">
        <div class="stat-label">Horas semana</div>
        <div class="stat-value" id="stat-semana">0h</div>
        <div class="stat-sub" id="stat-semana-sub">semana actual</div>
      </div>
      <div class="stat">
        <div class="stat-label">Horas totales</div>
        <div class="stat-value ok" id="stat-total">0h</div>
        <div class="stat-sub">acumulado</div>
      </div>
      <div class="stat">
        <div class="stat-label">Saldo de horas</div>
        <div class="stat-value" id="stat-comp">0h</div>
        <div class="stat-sub" id="stat-comp-sub">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Vacaciones</div>
        <div class="stat-value ok" id="stat-vac">0</div>
        <div class="stat-sub" id="stat-vac-sub">días disfrutados</div>
      </div>
    </div>

    <div class="sched-header">
      <span class="section-label" id="sched-titulo">Franjas horarias — Diego</span>
      <button class="btn-vacaciones" id="btn-vacaciones" onclick="toggleVacaciones()">☀ Marcar como vacaciones</button>
    </div>

    <!-- LEYENDA -->
    <div class="leyenda" id="leyenda"></div>

    <!-- BANNER VACACIONES (visible solo cuando el día es vacaciones) -->
    <div id="vacaciones-banner" class="hidden">
      <div class="vac-banner">
        <span class="vac-icon">☀</span>
        <span class="vac-txt">Día de vacaciones</span>
        <button class="vac-quitar" onclick="toggleVacaciones()">Quitar vacaciones</button>
      </div>
    </div>

    <div class="grid" id="grid-slots"></div>

    <div class="save-bar">
      <span class="save-msg" id="save-msg">Guardado en Sheets ✓</span>
      <button class="btn-save" id="btn-guardar" onclick="guardar()">Guardar día</button>
    </div>
  </div>

  <!-- TAB RESUMEN -->
  <div id="tab-resumen" class="hidden">
    <div class="saldo-tiles" id="saldo-tiles"></div>
    <div class="res-nota" id="res-nota"></div>
    <div id="res-tablas"></div>
  </div>

  <!-- TAB INFORME -->
  <div id="tab-informe" class="hidden">
    <div class="informe-controls">
      <div class="inf-emp-filter">
        <button class="inf-emp-btn active" onclick="setInfEmp('todos')" id="inf-btn-todos">Todos</button>
        <button class="inf-emp-btn" onclick="setInfEmp('Diego')" id="inf-btn-Diego">Diego</button>
        <button class="inf-emp-btn" onclick="setInfEmp('Jesus')" id="inf-btn-Jesus">Jesús</button>
        <button class="inf-emp-btn" onclick="setInfEmp('Alvarez')" id="inf-btn-Alvarez">Álvarez</button>
      </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMBUYb-BLIbo9iE3aQbqF-1CHYrHKPGpxsFm_iEnads4DuZahwDM3pkdlI7-ck0dh0/exec";

// Mapa labor → color
const LABOR_COLORS = {
  "Impartir clase":             "#1565C0",
  "Preparar clase":             "#6A1B9A",
  "Entrenamiento personal":     "#00695C",
  "Preparar EP personalizado":  "#2E7D32",
  "Grabar vídeo":               "#E65100",
  "Editar vídeo":               "#BF360C",
  "Llamadas":                   "#F9A825",
  "Repartir flyers":            "#558B2F",
  "Limpieza":                   "#795548",
  "Gestión Instagram":          "#AD1457",
  "Otros":                      "#546E7A"
};

const LABORES = ["", ...Object.keys(LABOR_COLORS)];

const FRANJAS = [];
for (let h = 7; h < 21; h++) {
  FRANJAS.push(pad(h) + ":00");
  FRANJAS.push(pad(h) + ":30");
}

const FECHA_CAMBIO_OBJETIVO = "2026-09-07"; // A partir de aquí el objetivo por defecto baja a 20h
const OBJETIVO_DIA = 6;
const OBJETIVO_SEMANA = 30;
const OBJETIVO_SEMANA_NUEVO = 20;

// ── SALDO DE HORAS ──
// El saldo se lleva semana a semana desde FECHA_ARRANQUE (lunes). Lo anterior es histórico.
// Convención interna: saldo > 0 = horas a favor del trabajador (se las debes tú);
//                     saldo < 0 = horas que el trabajador debe.
// Saldos de arranque = los validados al cierre de la semana del 31-ago-2026.
const FECHA_ARRANQUE = "2026-09-07";
const SALDO_ARRANQUE = { Diego: -9.5, Jesus: -3.5, Alvarez: 0 };
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

// Nombres de display
const NOMBRES = { Diego: "Diego", Jesus: "Jesús", Alvarez: "Álvarez" };
// Colores de empleado en calendario
const EMP_COLORES = { Diego: "#97272E", Jesus: "#1565C0", Alvarez: "#2E7D32" };

const EMPLEADOS = ["Diego", "Jesus", "Alvarez"];

let empleadoActual = "Diego";
let fechaActual = hoy();
let datos = {};
let infEmp = "todos";
let infPeriodo = "semana";

let vacaciones = { Diego: {}, Jesus: {}, Alvarez: {} };
const VAC_PREVIAS = { Diego: 1, Jesus: 8, Alvarez: 0 };

const PIN_ADMIN = "mnk";
let modoAdmin = false;
// ajustesSemana (viene de Sheets), clave = lunes de la semana:
//   "2026-09-07_obj" → horas que debía hacer esa semana (lo fija el admin; si falta, 20h)
//   "2026-09-07_var" → liquidación: horas saldadas esa semana (pagadas/descontadas)
//   "2026-09-07"     → saldo al cierre, solo informativo en Sheets (la app siempre lo recalcula)
let ajustesSemana = { Diego: {}, Jesus: {}, Alvarez: {} };

// ── INIT ─────────────────────────────────────────────────────────
async function init() {
  setSyncStatus("loading", "Sincronizando...");
  renderLeyenda();
  // Cargar desde localStorage como fallback inmediato
  const vacGuardadas = localStorage.getItem("codek_vacaciones");
  if (vacGuardadas) { try { vacaciones = JSON.parse(vacGuardadas); } catch(e) {} }
  const adjSemGuardados = localStorage.getItem("codek_ajustes_semana");
  if (adjSemGuardados) { try { ajustesSemana = JSON.parse(adjSemGuardados); } catch(e) {} }
  let backup = {};
  try { backup = JSON.parse(localStorage.getItem("codek_tareas_backup") || "{}"); } catch(e) {}
  try {
    const res = await fetch(SCRIPT_URL + "?accion=todos");
    const json = await res.json();
    if (json.ok) {
      datos = json.datos || {};
      // Sheets tiene prioridad — sobreescribe localStorage
      if (json.ajustes) {
        ajustesSemana = { Diego: {}, Jesus: {}, Alvarez: {} };
        Object.keys(json.ajustes).forEach(emp => {
          if (json.ajustes[emp]) ajustesSemana[emp] = json.ajustes[emp];
        });
        localStorage.setItem("codek_ajustes_semana", JSON.stringify(ajustesSemana));
      }
      // Días editados en este dispositivo que aún no llegaron a Sheets: la copia local manda
      Object.keys(pendientes).forEach(clave => {
        const [emp, fecha] = clave.split("|");
        if (!datos[emp]) datos[emp] = {};
        if (backup[emp] && backup[emp][fecha]) datos[emp][fecha] = backup[emp][fecha];
        else delete datos[emp][fecha];
      });
      localStorage.setItem("codek_tareas_backup", JSON.stringify(datos));
      setSyncStatus("ok", "Conectado · Sheets");
    } else throw new Error(json.error);
  } catch(err) {
    setSyncStatus("err", "Sin conexión");
    datos = backup;
  }
  document.getElementById("fecha-picker").value = fechaActual;
  document.getElementById("loader").style.display = "none";
  renderGrid();
  renderStats();
  if (Object.keys(pendientes).length) enviarPendientes();
}

// ── HELPERS ──────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2, "0"); }
function fmtFecha(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function hoy() { return fmtFecha(new Date()); }
function sumarDias(fecha, n) {
  const d = new Date(fecha + "T12:00:00");
  d.setDate(d.getDate() + n);
  return fmtFecha(d);
}
function lunesDe(fecha) {
  const d = new Date(fecha + "T12:00:00");
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return fmtFecha(d);
}
// "7–13 sep"
function rangoSemana(lunes) {
  const dom = sumarDias(lunes, 6);
  const mes = f => MESES[+f.slice(5,7) - 1].substring(0,3).toLowerCase();
  const dia = f => +f.slice(8,10);
  return mes(lunes) === mes(dom)
    ? dia(lunes) + "–" + dia(dom) + " " + mes(dom)
    : dia(lunes) + " " + mes(lunes) + " – " + dia(dom) + " " + mes(dom);
}
function r2(x) { return Math.round(x * 100) / 100; }
// Acepta "8,5" y "8.5". Vacío → null; texto no numérico → NaN
function parseHoras(txt) {
  const s = String(txt == null ? "" : txt).trim().replace(",", ".");
  if (s === "") return null;
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
function fmtNum(x) { return String(r2(x)).replace(".", ","); }
function fmtH(x) { return fmtNum(x) + "h"; }
function fmtVar(x) { x = r2(x); return (x > 0 ? "+" : x < 0 ? "−" : "") + fmtH(Math.abs(x)); }

// ── VACACIONES ───────────────────────────────────────────────────
function esDiaVacaciones(emp, fecha) {
  return !!(vacaciones[emp] && vacaciones[emp][fecha]);
}

function diasVacaciones(emp) {
  const propios = vacaciones[emp] ? Object.keys(vacaciones[emp]).filter(f => vacaciones[emp][f]).length : 0;
  return VAC_PREVIAS[emp] + propios;
}

function toggleVacaciones() {
  const esVac = esDiaVacaciones(empleadoActual, fechaActual);
  if (!vacaciones[empleadoActual]) vacaciones[empleadoActual] = {};
  if (esVac) {
    delete vacaciones[empleadoActual][fechaActual];
  } else {
    vacaciones[empleadoActual][fechaActual] = true;
    // Limpiar franjas del día si se marca como vacaciones
    if (datos[empleadoActual]) delete datos[empleadoActual][fechaActual];
  }
  localStorage.setItem("codek_vacaciones", JSON.stringify(vacaciones));
  renderGrid();
  renderStats();
  // Autoguardar el día (vacío) en Sheets para limpiar registros
  dispararAutoguardado();
}

function actualizarBannerVacaciones() {
  const esVac = esDiaVacaciones(empleadoActual, fechaActual);
  document.getElementById("vacaciones-banner").classList.toggle("hidden", !esVac);
  document.getElementById("btn-vacaciones").classList.toggle("activo", esVac);
  document.getElementById("btn-vacaciones").textContent = esVac ? "☀ Día de vacaciones ✓" : "☀ Marcar como vacaciones";
  document.getElementById("grid-slots").classList.toggle("dia-vacaciones", esVac);
}
function setSyncStatus(e, t) {
  const el = document.getElementById("sync-indicator");
  el.textContent = t; el.className = "sync-indicator " + e;
}
function horasDelDia(emp, fecha) {
  const d = datos[emp] && datos[emp][fecha] ? datos[emp][fecha] : {};
  return Object.values(d).filter(v => v.labor).length * 0.5;
}
function horasSemana(emp, fechaRef) {
  const lunes = lunesDe(fechaRef);
  let total = 0;
  for (let i = 0; i < 7; i++) total += horasDelDia(emp, sumarDias(lunes, i));
  return total;
}
function horasTotal(emp) {
  if (!datos[emp]) return 0;
  return Object.keys(datos[emp]).reduce((t,f) => t + horasDelDia(emp,f), 0);
}

// ── SALDO DE HORAS ───────────────────────────────────────────────
// Una sola regla, sin excepciones:
//   variación = horas hechas − horas que debía hacer
//   saldo     = saldo semana anterior + variación + liquidación
// Solo cuentan las semanas cerradas (domingo ya llegado). El objetivo lo fija el admin;
// si no lo ha fijado se usan 20h y la semana sale como "sin revisar".
// El Apps Script guarda los ajustes como enteros (8,5 → 8). Para no perder las medias horas,
// los valores con decimales se envían como ±(10000 + minutos): 8,5h → 10510. Los enteros van tal cual.
function codificarHoras(h) {
  h = r2(h);
  if (Number.isInteger(h)) return h;
  return Math.sign(h) * (10000 + Math.round(Math.abs(h) * 60));
}
function decodificarHoras(v) {
  v = Number(v);
  return Math.abs(v) >= 10000 ? r2(Math.sign(v) * (Math.abs(v) - 10000) / 60) : v;
}
function ajusteSemana(emp, lunes) {
  const aj = ajustesSemana[emp] || {};
  const vacio = v => v === undefined || v === null || v === "";
  const obj = aj[lunes + "_obj"], liq = aj[lunes + "_var"];
  return {
    obj: vacio(obj) ? null : decodificarHoras(obj),
    liq: vacio(liq) ? 0 : decodificarHoras(liq)
  };
}
function diasVacSemana(emp, lunes) {
  let n = 0;
  for (let i = 0; i < 5; i++) if (esDiaVacaciones(emp, sumarDias(lunes, i))) n++;
  return n;
}
function semanasSaldo(emp) {
  const hoyStr = hoy(), lunesHoy = lunesDe(hoyStr);
  const filas = [];
  let saldo = SALDO_ARRANQUE[emp] || 0;
  for (let l = FECHA_ARRANQUE; l <= lunesHoy; l = sumarDias(l, 7)) {
    const cerrada = sumarDias(l, 6) <= hoyStr;
    const hechas = horasSemana(emp, l);
    const aj = ajusteSemana(emp, l);
    const obj = aj.obj !== null ? aj.obj : OBJETIVO_SEMANA_NUEVO;
    const variacion = r2(hechas - obj);
    const saldoPrev = saldo;
    if (cerrada) saldo = r2(saldo + variacion + aj.liq);
    filas.push({ lunes: l, cerrada, hechas, obj, revisada: aj.obj !== null, variacion,
                 liq: aj.liq, saldoPrev, saldo: cerrada ? saldo : null, vac: diasVacSemana(emp, l) });
  }
  return filas;
}
function saldoActual(emp) {
  const cerradas = semanasSaldo(emp).filter(f => f.cerrada);
  return cerradas.length ? cerradas[cerradas.length - 1].saldo : (SALDO_ARRANQUE[emp] || 0);
}
function filaSemana(emp, lunes) {
  return semanasSaldo(emp).find(f => f.lunes === lunes) || null;
}
function textoSaldo(emp, s) {
  s = r2(s);
  if (s === 0) return "Al día";
  return s < 0 ? NOMBRES[emp] + " te debe " + fmtH(-s) : "Le debes " + fmtH(s) + " a " + NOMBRES[emp];
}
function saldoCorto(s) { s = r2(s); return s === 0 ? "al día" : s < 0 ? "debe " + fmtH(-s) : "a favor " + fmtH(s); }
function claseSaldo(s) { s = r2(s); return s === 0 ? "ok" : s < 0 ? "bad" : "warn"; }

// ── LEYENDA ──────────────────────────────────────────────────────
function renderLeyenda() {
  const el = document.getElementById("leyenda");
  el.innerHTML = Object.entries(LABOR_COLORS).map(([l,c]) =>
    `<div class="leyenda-item"><div class="leyenda-dot" style="background:${c}"></div>${l}</div>`
  ).join("");
}

// ── RENDER GRID ──────────────────────────────────────────────────
function renderGrid() {
  const emp = empleadoActual;
  const fecha = fechaActual;
  const diaData = (datos[emp]&&datos[emp][fecha]) ? datos[emp][fecha] : {};
  document.getElementById("sched-titulo").textContent = "Franjas horarias — " + NOMBRES[emp];
  actualizarBannerVacaciones();

  let html = "";
  FRANJAS.forEach(franja => {
    const val = diaData[franja] || { labor:"", comentario:"" };
    const labor = val.labor || "";
    const esClase = labor === "Impartir clase";
    const dataAttr = labor ? ` data-labor="${labor}"` : "";

    const opts = LABORES.map(l =>
      `<option value="${l}"${l===labor?" selected":""}>${l||"· sin actividad ·"}</option>`
    ).join("");

    html += `<div class="slot" id="slot-${franja}"${dataAttr}>`;
    html += `<div class="slot-time">${franja}</div>`;
    // Botón rápido clase
    html += `<button class="slot-clase-btn${esClase?" activo":""}" onclick="toggleClase('${franja}')" title="Impartir clase">▶</button>`;
    html += `<select class="slot-select${labor?" filled":""}" onchange="onLaborChange(this,'${franja}')">${opts}</select>`;
    html += `<textarea class="slot-comment" placeholder="Comentario..." onchange="onCommentChange(this,'${franja}')">${val.comentario||""}</textarea>`;
    html += `</div>`;
  });
  document.getElementById("grid-slots").innerHTML = html;
}

// ── TOGGLE RÁPIDO CLASE ──────────────────────────────────────────
function toggleClase(franja) {
  ensureDia();
  if (!datos[empleadoActual][fechaActual][franja]) datos[empleadoActual][fechaActual][franja] = {labor:"",comentario:""};
  const actual = datos[empleadoActual][fechaActual][franja].labor;
  const nuevo = actual === "Impartir clase" ? "" : "Impartir clase";
  datos[empleadoActual][fechaActual][franja].labor = nuevo;
  actualizarSlot(franja, nuevo);
  renderStats();
  dispararAutoguardado();
}

// ── AUTOGUARDADO ─────────────────────────────────────────────────
// Cada día editado entra en una cola { "emp|fecha": versión } guardada en localStorage.
// Solo sale de la cola cuando Sheets confirma, así no se pierde nada aunque se cambie
// de día/trabajador o se cierre la página antes de que termine el envío.
let autoguardTimer = null, reintentoTimer = null, msgTimer = null;
let pendientes = cargarPendientes();
let enviando = false;

function cargarPendientes() {
  try { return JSON.parse(localStorage.getItem("codek_pendientes") || "{}") || {}; } catch(e) { return {}; }
}
function persistirPendientes() {
  localStorage.setItem("codek_pendientes", JSON.stringify(pendientes));
}
function mostrarMsg(txt, color, fijo) {
  const msg = document.getElementById("save-msg");
  msg.textContent = txt;
  msg.style.color = color;
  msg.classList.add("show");
  clearTimeout(msgTimer);
  if (!fijo) msgTimer = setTimeout(() => msg.classList.remove("show"), 2500);
}

function dispararAutoguardado() {
  const clave = empleadoActual + "|" + fechaActual;
  pendientes[clave] = (pendientes[clave] || 0) + 1;
  persistirPendientes();
  localStorage.setItem("codek_tareas_backup", JSON.stringify(datos));
  mostrarMsg("Guardando...", "var(--amarillo)", true);
  clearTimeout(autoguardTimer);
  autoguardTimer = setTimeout(enviarPendientes, 1500);
}

async function enviarPendientes() {
  clearTimeout(autoguardTimer);
  clearTimeout(reintentoTimer);
  if (enviando) { autoguardTimer = setTimeout(enviarPendientes, 1000); return null; }
  enviando = true;
  let ok = true;
  try {
    for (let vuelta = 0; vuelta < 3 && ok && Object.keys(pendientes).length; vuelta++) {
      for (const clave of Object.keys(pendientes)) {
        const version = pendientes[clave];
        const [emp, fecha] = clave.split("|");
        const franjas = (datos[emp] && datos[emp][fecha]) ? datos[emp][fecha] : {};
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ empleado: emp, fecha, franjas })
          });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error);
          // Si se volvió a editar mientras se enviaba, se queda en cola para la siguiente vuelta
          if (pendientes[clave] === version) delete pendientes[clave];
          persistirPendientes();
        } catch(err) {
          ok = false;
          break;
        }
      }
    }
  } finally {
    enviando = false;
  }
  if (ok) {
    setSyncStatus("ok", "Guardado · Sheets");
    mostrarMsg("Guardado ✓", "var(--verde)");
  } else {
    setSyncStatus("err", "Error al guardar");
    mostrarMsg("Sin conexión — guardado en este dispositivo, se reintentará", "var(--granate)", true);
    reintentoTimer = setTimeout(enviarPendientes, 30000);
  }
  return ok;
}

function onLaborChange(sel, franja) {
  ensureDia();
  if (!datos[empleadoActual][fechaActual][franja]) datos[empleadoActual][fechaActual][franja] = {labor:"",comentario:""};
  datos[empleadoActual][fechaActual][franja].labor = sel.value;
  actualizarSlot(franja, sel.value);
  renderStats();
  dispararAutoguardado();
}

function actualizarSlot(franja, labor) {
  const slot = document.getElementById("slot-" + franja);
  const btn = slot.querySelector(".slot-clase-btn");
  const sel = slot.querySelector(".slot-select");
  if (labor) {
    slot.setAttribute("data-labor", labor);
  } else {
    slot.removeAttribute("data-labor");
  }
  sel.value = labor;
  sel.classList.toggle("filled", !!labor);
  btn.classList.toggle("activo", labor === "Impartir clase");
}

function onCommentChange(ta, franja) {
  ensureDia();
  if (!datos[empleadoActual][fechaActual][franja]) datos[empleadoActual][fechaActual][franja] = {labor:"",comentario:""};
  datos[empleadoActual][fechaActual][franja].comentario = ta.value;
  dispararAutoguardado();
}

function ensureDia() {
  if (!datos[empleadoActual]) datos[empleadoActual] = {};
  if (!datos[empleadoActual][fechaActual]) datos[empleadoActual][fechaActual] = {};
}

// ── STATS ────────────────────────────────────────────────────────
function renderStats() {
  const emp = empleadoActual;
  const esVac = esDiaVacaciones(emp, fechaActual);
  const hd = esVac ? 0 : horasDelDia(emp, fechaActual);
  const hs = horasSemana(emp, fechaActual);
  const comp = saldoActual(emp);

  const sh = document.getElementById("stat-hoy");
  if (esVac) {
    sh.textContent = "☀";
    sh.className = "stat-value warn";
    document.querySelector("#stat-hoy").parentElement.querySelector(".stat-sub").textContent = "vacaciones";
  } else {
    sh.textContent = hd+"h";
    sh.className = "stat-value "+(hd>=OBJETIVO_DIA?"ok":hd>=OBJETIVO_DIA*.7?"warn":"bad");
    document.querySelector("#stat-hoy").parentElement.querySelector(".stat-sub").textContent = "de 6h objetivo";
  }

  const lunesSel = lunesDe(fechaActual);
  let objSem;
  if (lunesSel >= FECHA_ARRANQUE) {
    const aj = ajusteSemana(emp, lunesSel);
    objSem = aj.obj !== null ? aj.obj : OBJETIVO_SEMANA_NUEVO;
  } else {
    objSem = objetivoSemana(lunesSel);
  }
  const ss = document.getElementById("stat-semana");
  ss.textContent = fmtH(hs);
  ss.className = "stat-value "+(hs>=objSem?"ok":hs>=objSem*.7?"warn":"bad");
  document.getElementById("stat-semana-sub").textContent = "de " + fmtH(objSem) + " esa semana";

  document.getElementById("stat-total").textContent = fmtH(horasTotal(emp));

  const sc = document.getElementById("stat-comp");
  sc.textContent = fmtH(Math.abs(comp));
  sc.className = "stat-value " + claseSaldo(comp);
  document.getElementById("stat-comp-sub").textContent = textoSaldo(emp, comp);

  document.getElementById("stat-vac").textContent = diasVacaciones(empleadoActual);
  document.getElementById("stat-vac-sub").textContent = "días disfrutados";
}

function tablaResumen(emp) {
  const filas = semanasSaldo(emp);
  const s = saldoActual(emp);
  // Mes de cada semana = el del jueves (el mes que tiene la mayoría de sus días)
  const mesDe = lunes => sumarDias(lunes, 3).slice(0, 7);

  let html = `<tr class="inicial"><td>Saldo inicial (hasta 6 sep)</td><td></td><td></td><td></td><td></td>
    <td class="${claseSaldo(SALDO_ARRANQUE[emp]||0)}">${saldoCorto(SALDO_ARRANQUE[emp]||0)}</td></tr>`;

  let mesActual = null, tot = null;
  const cerrarMes = () => {
    if (!tot || !tot.semanas) return "";
    return `<tr class="subtotal"><td>Total ${MESES[+mesActual.slice(5,7)-1].toLowerCase()}</td>
      <td>${fmtH(tot.hechas)}</td><td>${fmtH(tot.obj)}</td>
      <td class="${tot.variacion>=0?"ok":"bad"}">${fmtVar(tot.variacion)}</td>
      <td>${tot.liq ? fmtVar(tot.liq) : ""}</td>
      <td class="${claseSaldo(tot.saldo)}">${saldoCorto(tot.saldo)}</td></tr>`;
  };

  filas.forEach(f => {
    const mes = mesDe(f.lunes);
    if (mes !== mesActual) {
      html += cerrarMes();
      mesActual = mes;
      tot = { hechas: 0, obj: 0, variacion: 0, liq: 0, saldo: 0, semanas: 0 };
      html += `<tr class="mes"><td colspan="6">${MESES[+mes.slice(5,7)-1]} ${mes.slice(0,4)}</td></tr>`;
    }
    if (f.cerrada) {
      tot.hechas += f.hechas; tot.obj += f.obj; tot.variacion = r2(tot.variacion + f.variacion);
      tot.liq = r2(tot.liq + f.liq); tot.saldo = f.saldo; tot.semanas++;
    }

    const vac = f.vac ? `<span class="tag tag-vac" title="Días de vacaciones marcados (L-V)">☀ ${f.vac}d vac</span>` : "";
    const rev = (f.cerrada && !f.revisada) ? `<span class="tag tag-rev">sin revisar</span>` : "";
    const objCell = modoAdmin
      ? `<input class="adm-in" inputmode="decimal" value="${f.revisada ? fmtNum(f.obj) : ""}" placeholder="${fmtNum(f.obj)}"
           onkeydown="if(event.key==='Enter')this.blur()" onchange="onObjChange('${emp}','${f.lunes}',this)">h${rev}`
      : `${fmtH(f.obj)}${rev}`;

    let liqCell = f.liq ? `<span title="Liquidación">${fmtVar(f.liq)}</span>` : "";
    if (modoAdmin && f.cerrada) {
      liqCell += f.liq
        ? `<button class="adm-btn" onclick="quitarLiquidacion('${emp}','${f.lunes}')">deshacer</button>`
        : `<button class="adm-btn" onclick="liquidar('${emp}','${f.lunes}')">Liquidar</button>`;
    }

    if (f.cerrada) {
      html += `<tr><td>${rangoSemana(f.lunes)}${vac}</td>
        <td>${fmtH(f.hechas)}</td><td>${objCell}</td>
        <td class="${f.variacion>=0?"ok":"bad"}">${fmtVar(f.variacion)}</td>
        <td>${liqCell}</td>
        <td class="${claseSaldo(f.saldo)}">${saldoCorto(f.saldo)}</td></tr>`;
    } else {
      html += `<tr class="en-curso"><td>${rangoSemana(f.lunes)}${vac}</td>
        <td>${fmtH(f.hechas)}</td><td>${objCell}</td>
        <td colspan="2">en curso</td><td>—</td></tr>`;
    }
  });
  html += cerrarMes();

  return `<div class="res-card">
    <div class="res-card-head"><span class="cal-emp-dot" style="background:${EMP_COLORES[emp]}"></span>${NOMBRES[emp]}
      <span class="res-saldo ${claseSaldo(s)}">${textoSaldo(emp, s)}</span></div>
    <table class="rtable"><thead><tr><th>Semana</th><th>Hechas</th><th>Debía</th><th>Variación</th><th>Liquidado</th><th>Saldo</th></tr></thead>
    <tbody>${html}</tbody></table></div>`;
}

// ── INFORME ──────────────────────────────────────────────────────
function getRangoSemana() {
  const d = new Date(hoy()+"T12:00:00"), l = new Date(d);
  l.setDate(d.getDate()-((d.getDay()+6)%7));
  const v = new Date(l); v.setDate(l.getDate()+6);
  const fmt = x => x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());
  return { desde: fmt(l), hasta: fmt(v) };
}
function getRangoMes() {
  const d = new Date();
  const desde = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-01";
  const u = new Date(d.getFullYear(),d.getMonth()+1,0);
  return { desde, hasta: u.getFullYear()+"-"+pad(u.getMonth()+1)+"-"+pad(u.getDate()) };
}
function getRangoActual() {
  if (infPeriodo==="semana") return getRangoSemana();
  if (infPeriodo==="mes") return getRangoMes();
  return { desde: document.getElementById("inf-desde").value||hoy(), hasta: document.getElementById("inf-hasta").value||hoy() };
}
function calcTareas(emp, desde, hasta) {
  const r = {};
  Object.keys(LABOR_COLORS).forEach(l => r[l]=0);
  if (!datos[emp]) return r;
  Object.keys(datos[emp]).forEach(f => {
    if (f<desde||f>hasta) return;
    Object.values(datos[emp][f]).forEach(v => { if(v.labor&&r[v.labor]!==undefined) r[v.labor]+=0.5; });
  });
  return r;
}
function setInfEmp(emp) {
  infEmp = emp;
  ["todos","Diego","Jesus","Alvarez"].forEach(e => { const el=document.getElementById("inf-btn-"+e); if(el) el.classList.toggle("active",e===emp); });
  renderInforme();
}
function setPeriodo(p) {
  infPeriodo = p;
  ["semana","mes","custom"].forEach(x => document.getElementById("pbtn-"+x).classList.toggle("active",x===p));
  document.getElementById("range-custom").style.display = p==="custom"?"flex":"none";
  if (p!=="custom") renderInforme();
}
function renderInforme() {
  const {desde,hasta} = getRangoActual();
  const emps = infEmp==="todos"?["Diego","Jesus","Alvarez"]:[infEmp];
  const combinado = {}; Object.keys(LABOR_COLORS).forEach(l => combinado[l]=0);
  let bodyHtml = "";

  emps.forEach(emp => {
    const tareas = calcTareas(emp,desde,hasta);
    const total = Object.values(tareas).reduce((a,b)=>a+b,0);
    Object.keys(tareas).forEach(l => combinado[l]+=tareas[l]);
    const sorted = Object.entries(tareas).filter(([,h])=>h>0).sort((a,b)=>b[1]-a[1]);
    const maxH = sorted.length ? sorted[0][1] : 1;
    const rows = sorted.length===0
      ? `<div class="inf-empty">Sin registros en este período</div>`
      : sorted.map(([l,h]) => {
          const pct = Math.round((h/maxH)*100);

          return `<div class="inf-labor-row"><div class="inf-labor-dot" style="background:${color}"></div><span class="inf-labor-name">${l}</span><div class="inf-labor-bar-wrap"><div class="inf-labor-bar" style="width:${pct}%;background:${color}"></div></div><span class="inf-labor-hrs">${h}h</span></div>`;
        }).join("");
    bodyHtml += `<div class="inf-card"><div class="inf-card-head"><span class="inf-card-title">${NOMBRES[emp]}</span><span class="inf-card-total">${fmtH(total)} total</span></div>${rows}</div>`;
  });
  document.getElementById("informe-body").innerHTML = bodyHtml;

  const combEl = document.getElementById("inf-combined");
  if (infEmp==="todos") {
    const sorted = Object.entries(combinado).filter(([,h])=>h>0).sort((a,b)=>b[1]-a[1]);
    const total = sorted.reduce((a,[,h])=>a+h,0);
    const maxH = sorted.length ? sorted[0][1] : 1;
    const df = desde.split("-").reverse().join("/"), hf = hasta.split("-").reverse().join("/");
    const rows = sorted.length===0
      ? `<div class="inf-empty">Sin registros en este período</div>`
      : sorted.map(([l,h]) => {
          const pct = Math.round((h/maxH)*100);
          const color = LABOR_COLORS[l]||"#666";
          return `<div class="inf-labor-row"><div class="inf-labor-dot" style="background:${color}"></div><span class="inf-labor-name">${l}</span><div class="inf-labor-bar-wrap"><div class="inf-labor-bar" style="width:${pct}%;background:${color}"></div></div><span class="inf-labor-hrs">${h}h</span></div>`;
        }).join("");
    combEl.innerHTML = `<div class="inf-combined-head">Total equipo — ${df} al ${hf} — ${total}h</div>${rows}`;
    combEl.style.display = "block";

// ── CALENDARIO ───────────────────────────────────────────────────
let calAnio = new Date().getFullYear();
let calMes  = new Date().getMonth();

// Objetivo histórico (antes de FECHA_ARRANQUE): solo para mostrar, no entra en el saldo
function objetivoSemana(lunesKey) {
  return lunesKey >= FECHA_CAMBIO_OBJETIVO ? OBJETIVO_SEMANA_NUEVO : OBJETIVO_SEMANA;
}

function cambiarMes(delta) {
  calMes += delta;
  if (calMes > 11) { calMes = 0; calAnio++; }
  if (calMes < 0)  { calMes = 11; calAnio--; }
  renderCalendario();
}

function renderCalendario() {
  const hoyStr = hoy();
  document.getElementById("cal-mes-label").textContent = MESES[calMes] + " " + calAnio;

  const primerDia    = new Date(calAnio, calMes, 1);
  const ultimoDia    = new Date(calAnio, calMes + 1, 0);
  const offsetInicio = (primerDia.getDay() + 6) % 7;
  const numSemanas   = Math.ceil((offsetInicio + ultimoDia.getDate()) / 7);

  // Semanas con saldo, indexadas por lunes
  const semanas = {};
  EMPLEADOS.forEach(emp => {
    semanas[emp] = {};
    semanasSaldo(emp).forEach(f => { semanas[emp][f.lunes] = f; });
  });

  let html = ["L","M","X","J","V","S","D"].map(d =>
    `<div class="cal-dow">${d}</div>`
  ).join("") + `<div class="cal-dow cal-dow-total">Resumen</div>`;

  for (let sem = 0; sem < numSemanas; sem++) {
    const diasSemana = [];
    for (let dow = 0; dow < 7; dow++) {
      const fecha = new Date(calAnio, calMes, 1 + sem * 7 + dow - offsetInicio);
      diasSemana.push({ fecha, fechaStr: fmtFecha(fecha), dow });
    }
    const lunesKey = diasSemana[0].fechaStr;

    // Días
    let semHtml = "";
    diasSemana.forEach(({fecha, fechaStr}) => {
      const esMes = fecha.getMonth() === calMes;
      const esFS  = fecha.getDay() === 0 || fecha.getDay() === 6;
      let cls = "cal-day";
      if (!esMes) cls += " otro-mes";
      if (fechaStr === hoyStr) cls += " hoy";
      if (esFS) cls += " fin-semana";
      if (EMPLEADOS.some(e => esDiaVacaciones(e, fechaStr))) cls += " vacaciones";

      const mesLbl = !esMes ? `<span style="font-size:8px;color:#555;margin-left:2px">${MESES[fecha.getMonth()].substring(0,3)}</span>` : "";

      const rows = EMPLEADOS.map(emp => {
        const dot = `<span style="background:${EMP_COLORES[emp]}" class="cal-emp-dot"></span>`;
        if (esDiaVacaciones(emp, fechaStr))
          return `<div class="cal-emp-row">${dot}<span class="cal-vac-label">☀ vac</span></div>`;
        const h = horasDelDia(emp, fechaStr);
        const c = "cal-emp-hrs "+(h===0?"vacio":h>=OBJETIVO_DIA?"ok":h>=OBJETIVO_DIA*.5?"warn":"bad");
        return `<div class="cal-emp-row">${dot}<span class="${c}">${h>0?fmtH(h):"—"}</span><span class="cal-emp-name">${NOMBRES[emp]}</span></div>`;
      }).join("");

      semHtml += `<div class="${cls}" onclick="abrirDia('${fechaStr}')" style="cursor:pointer"><div class="cal-num">${fecha.getDate()}${mesLbl}</div>${rows}</div>`;
    });

    // Columna resumen
    const bloque = emp => {
      const head = `<div class="cs-head"><span class="cal-emp-dot" style="background:${EMP_COLORES[emp]}"></span>${NOMBRES[emp]}</div>`;
      const tot = horasSemana(emp, lunesKey);

      if (lunesKey < FECHA_ARRANQUE) {
        if (emp === "Alvarez") return `<div class="cs">${head}<div class="cs-body">—</div></div>`;
        const vac = diasVacSemana(emp, lunesKey);
        const objHist = Math.max(0, objetivoSemana(lunesKey) - vac * OBJETIVO_DIA);
        return `<div class="cs">${head}<div class="cs-body">${fmtH(tot)} / ${fmtH(objHist)}<br><span style="font-size:9px">histórico</span></div></div>`;
      }

      const f = semanas[emp][lunesKey];
      if (!f) return `<div class="cs">${head}<div class="cs-body">—</div></div>`;  // semana futura

      const cH = f.hechas>=f.obj?"ok":f.hechas>=f.obj*.7?"warn":f.hechas>0?"bad":"vacio";
      const objHtml = modoAdmin
        ? `<input class="adm-in" inputmode="decimal" value="${f.revisada ? fmtNum(f.obj) : ""}" placeholder="${fmtNum(f.obj)}"
             onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter')this.blur()"
             onchange="onObjChange('${emp}','${f.lunes}',this)">h`
        : fmtH(f.obj) + (f.cerrada && !f.revisada ? ` <span class="warn" title="Sin revisar: se usan 20h">?</span>` : "");

      let cuerpo = `<span class="cal-emp-hrs ${cH}">${fmtH(f.hechas)}</span> / ${objHtml}<br>`;
      if (f.cerrada) {
        cuerpo += `<span class="${f.variacion>=0?"ok":"bad"}">${fmtVar(f.variacion)}</span>`;
        if (f.liq) cuerpo += ` <span title="Liquidado">liq ${fmtVar(f.liq)}</span>`;
        cuerpo += `<br><b class="${claseSaldo(f.saldo)}">${saldoCorto(f.saldo)}</b>`;
      } else {
        cuerpo += `<span style="font-size:9px">en curso</span>`;
      }
      return `<div class="cs">${head}<div class="cs-body">${cuerpo}</div></div>`;
    };

    semHtml += `<div class="cal-day cal-total-semana" style="padding:8px 10px;border-left:2px solid rgba(151,39,46,0.4)">
      ${EMPLEADOS.map(bloque).join('<div class="cs-sep"></div>')}
    </div>`;

    html += semHtml;
  }

  document.getElementById("cal-grid").innerHTML = html;
}

function abrirDia(fechaStr) {
  fechaActual = fechaStr;
  document.getElementById("fecha-picker").value = fechaStr;
  showTab("registro");
  renderGrid();
  renderStats();
}

// ── MODO ADMINISTRADOR ───────────────────────────────────────────
function refrescarVistas() {
  renderStats();
  if (!document.getElementById("tab-resumen").classList.contains("hidden")) renderResumen();
  if (!document.getElementById("tab-calendario").classList.contains("hidden")) renderCalendario();
}

function toggleAdmin() {
  const btn = document.getElementById("btn-admin");
  if (modoAdmin) {
    modoAdmin = false;
    btn.style.borderColor = "var(--gris-borde)";
    btn.style.color = "var(--gris-texto)";
    btn.textContent = "⚙ Admin";
    refrescarVistas();
    return;
  }
  const pin = prompt("PIN de administrador:");
  if (pin === PIN_ADMIN) {
    modoAdmin = true;
    btn.style.borderColor = "var(--granate)";
    btn.style.color = "var(--granate)";
    btn.textContent = "⚙ Admin ON";
    if (!document.getElementById("tab-calendario").classList.contains("hidden")) renderCalendario();
    else showTab("resumen");
  } else if (pin !== null) {
    alert("PIN incorrecto");
  }
}

// El admin cambia las horas que debía hacer esa semana. Vacío = volver a "sin revisar" (20h).
function onObjChange(emp, lunes, input) {
  const v = parseHoras(input.value);
  if (Number.isNaN(v) || (v !== null && v < 0)) {
    alert("Escribe un número de horas, por ejemplo 18 o 8,5");
    refrescarVistas();
    return;
  }
  guardarSemana(emp, lunes, v, ajusteSemana(emp, lunes).liq);
}

function liquidar(emp, lunes) {
  const f = filaSemana(emp, lunes);
  if (!f || !f.cerrada) return;
  const saldo = r2(f.saldoPrev + f.variacion);   // saldo al cierre de esa semana, antes de liquidar
  if (saldo === 0) { alert(NOMBRES[emp] + " ya está al día esa semana."); return; }
  const resp = prompt(
    textoSaldo(emp, saldo) + " al cierre de la semana " + rangoSemana(lunes) + ".\n" +
    "¿Cuántas horas se liquidan (pagadas o descontadas en nómina)?\n" +
    "Deja " + fmtNum(Math.abs(saldo)) + " para dejarlo al día.",
    fmtNum(Math.abs(saldo)));
  if (resp === null) return;
  const horas = parseHoras(resp);
  if (horas === null || Number.isNaN(horas) || horas <= 0) { alert("Cantidad no válida"); return; }
  // Liquidar mueve el saldo hacia 0: si debe horas suma, si se le deben resta
  const liq = saldo < 0 ? horas : -horas;
  guardarSemana(emp, lunes, f.revisada ? f.obj : null, r2(liq));
}

function quitarLiquidacion(emp, lunes) {
  const f = filaSemana(emp, lunes);
  if (!f) return;
  if (!confirm("¿Quitar la liquidación de " + fmtH(Math.abs(f.liq)) + " de " + NOMBRES[emp] + " (semana " + rangoSemana(lunes) + ")?")) return;
  guardarSemana(emp, lunes, f.revisada ? f.obj : null, 0);
}

async function guardarSemana(emp, lunes, obj, liq) {
  if (!ajustesSemana[emp]) ajustesSemana[emp] = {};
  const aj = ajustesSemana[emp];
  const borrar = obj === null && !liq;
  if (borrar) {
    delete aj[lunes]; delete aj[lunes + "_obj"]; delete aj[lunes + "_var"];
  } else {
    aj[lunes + "_obj"] = codificarHoras(obj === null ? OBJETIVO_SEMANA_NUEVO : obj);
    aj[lunes + "_var"] = codificarHoras(liq || 0);
    const f = filaSemana(emp, lunes);
    aj[lunes] = f && f.saldo !== null ? f.saldo : 0;   // solo informativo en Sheets (allí se redondea)
  }
  localStorage.setItem("codek_ajustes_semana", JSON.stringify(ajustesSemana));
  refrescarVistas();

  setSyncStatus("loading", "Guardando...");
  const body = borrar
    ? { accion: "borrarAjuste", emp, semana: lunes }
    : { accion: "guardarAjuste", emp, semana: lunes, saldo: aj[lunes], obj: aj[lunes + "_obj"], varh: aj[lunes + "_var"] };
  try {
    const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(body) });
    const json = await res.json();
    if (json && json.ok === false) throw new Error(json.error);
    setSyncStatus("ok", "Guardado · Sheets");
  } catch(e) {
    setSyncStatus("err", "Error al guardar");
    alert("No se pudo guardar en Sheets. El cambio está solo en este dispositivo: vuelve a intentarlo con conexión.");
  }
}

init();
</script>
